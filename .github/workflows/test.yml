name: Test

on:
  push:
    branches:
      - master
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      # todo remove once fixed https://github.com/actions/setup-node/issues/531
      - run: corepack enable

      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: 'yarn'
          cache-dependency-path: |
            yarn.lock
            legacy/yarn.lock

      - run: yarn install --immutable

      # the legacy ESLint config is the reference for the parity tests
      - run: yarn install --immutable
        working-directory: legacy

      - run: yarn lint

      - run: yarn test
